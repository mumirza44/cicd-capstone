version: "3"

env:
  GITHUB_TOKEN:
    sh: gh auth token

tasks:
  trigger-workflow-workflow-dispatch:
    desc: Trigger Github Actions workflow using act
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          --env PATH=/opt/acttoolcache/node/24.19.0/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          -s GITHUB_TOKEN="{{.GITHUB_TOKEN}}" \
          -e {{.PWD}}/workflow-dispatch-event.json \
          -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
          --directory ../../.. \
          -W .github/workflows/build-push.yaml
          
  trigger-workflow-tag:
    desc: Trigger Github Actions workflow using act
    cmds:
      - |
        act push \
          --container-architecture linux/amd64 \
          --env PATH=/opt/acttoolcache/node/24.19.0/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          -s GITHUB_TOKEN="{{.GITHUB_TOKEN}}" \
          -e {{.PWD}}/push-tag-event.json \
          -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
          --directory ../../.. \
          --no-skip-checkout \
          -W .github/workflows/build-push.yaml
